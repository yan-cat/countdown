name: Build Windows EXE (MSYS2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6
            mingw-w64-x86_64-qt6-quick
            mingw-w64-x86_64-qt6-qml
            mingw-w64-x86_64-kf6-coreaddons
            mingw-w64-x86_64-kf6-kirigami
            mingw-w64-x86_64-make

      - name: Configure with CMake
        shell: msys2 {0}
        run: |
          cmake -B build-win -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build-win --parallel

      - name: Collect DLLs with windeployqt
        shell: msys2 {0}
        run: |
          # windeployqt 在 MSYS2 的 bin 目录下
          /mingw64/bin/windeployqt6.exe --qmldir ./src/qt/qml ./build-win/Countdown.exe
          # 同时复制需要的一些 KF6 运行时 DLL（windeployqt 不会自动复制 KF6 的）
          # 这里手动将必要的 KF6 DLL 复制过来
          cp /mingw64/bin/libKF6CoreAddons*.dll ./build-win/
          cp /mingw64/bin/libKF6Kirigami*.dll ./build-win/
          cp /mingw64/bin/libKF6I18n*.dll ./build-win/   # Kirigami 可能依赖
          # 如果需要其他，可以继续加

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-win64-msys2
          path: |
            build-win/Countdown.exe
            build-win/*.dll
            src/qt/qml/   # 如果你的 QML 文件需要单独部署，也一并打包
