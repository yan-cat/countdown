name: Build with KDE Craft

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python and Git
        run: |
          choco install python3 git -y
          echo "C:\Python3" >> $env:GITHUB_PATH
          echo "C:\Python3\Scripts" >> $env:GITHUB_PATH

      - name: Install KDE Craft
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          iex ((new-object net.webclient).DownloadString('https://raw.githubusercontent.com/KDE/craft/master/setup/install_craft.ps1'))

      - name: Create Blueprint directory and copy our blueprint
        shell: cmd
        run: |
          mkdir C:\CraftRoot\blueprints\countdown
          copy blueprints\countdown.py C:\CraftRoot\blueprints\countdown\

      - name: Build Countdown with Craft
        shell: cmd
        run: |
          call C:\CraftRoot\craft\env.bat
          # 现在 Craft 能识别 countdown 这个包了
          craft countdown

      - name: Collect artifacts
        shell: cmd
        run: |
          # 构建后的 .exe 通常会放在 C:\CraftRoot\build\countdown\install\bin\ 或类似位置
          # 我们复制到当前目录以方便上传
          xcopy C:\CraftRoot\build\countdown\install\bin\Countdown.exe . /Y
          # 还需要复制所有依赖的 .dll 吗？Craft 的 deploy 功能可以帮忙，但这里先简单复制
