name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: '发布名称 (可选，留空则自动生成)'
        required: false
        default: ''
      draft:
        description: '是否为草稿'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '是否为预发布'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 处理前置
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

      - name: 安装 KDE Craft
        run: |
          $scriptContent = (new-object net.webclient).DownloadString('https://invent.kde.org/packaging/craft/-/raw/master/setup/install_craft.ps1')
          "0" | & ([scriptblock]::Create($scriptContent)) -root "C:\CraftRoot" -useDefaults

      - name: 测试
        run: |
          powershell C:\CraftRoot\craft\craftenv.ps1
          craft
