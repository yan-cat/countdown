name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: '发布名称 (可选，留空则自动生成)'
        required: false
        default: ''
      draft:
        description: '是否为草稿'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '是否为预发布'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install python3 python3-pip python3-venv build-essential git wget libxcb-xinerama0-dev libegl1-mesa-dev

      - name: 安装 KDE Craft
        run: |
          python3 -c "$(wget https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py -O -)" --prefix ~/CraftRoot --abi x86_64

