name: build-linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: '发布名称 (可选，留空则自动生成)'
        required: false
        default: ''
      draft:
        description: '是否为草稿'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '是否为预发布'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    permissions:
      contents: write   # 必须，用于创建 Release 和上传附件

    steps:
      - name: 安装依赖
        run: pacman -Syu --noconfirm git cmake ninja \
              extra-cmake-modules qt6-base qt6-declarative \
              kirigami kcoreaddons

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: 编译
        run: cmake --build build

      - name: 打包可执行文件
        run: |
          mkdir -p dist
          cp build/Countdown dist/
          tar -czf Countdown-linux-arch-x86_64.tar.gz -C dist Countdown

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Countdown-linux-arch-x86_64
          path: Countdown-linux-arch-x86_64.tar.gz

      - name: 创建发布并上传附件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.release_name || format('Release {0}', github.event.inputs.version) }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: Countdown-linux-arch-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
