name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 使用 KDE Craft 构建 APK
        run: |
          # 创建 Craft 工作目录
          mkdir -p craft-kde-android

          # 初始化 Craft 环境，并自动输入 'arm64' 作为架构选择
          echo "arm64" | docker run -i --rm \
            -v $PWD/craft-kde-android:/home/user/CraftRoot \
            kdeorg/android-sdk \
            craft-bootstrap

          # 构建你的应用（将 your_app_name 替换为实际名称）
          docker run --rm \
            -v $PWD/craft-kde-android:/home/user/CraftRoot \
            kdeorg/android-sdk \
            craft your_app_name

          # 打包为 APK
          docker run --rm \
            -v $PWD/craft-kde-android:/home/user/CraftRoot \
            kdeorg/android-sdk \
            craft --package your_app_name

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: craft-kde-android/tmp/*.apk
