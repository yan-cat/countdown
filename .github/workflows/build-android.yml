name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # 使用 KDE 官方文档推荐的 Qt6 Android 镜像
      image: invent-registry.kde.org/sysadmin/ci-images/android-qt67:latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 初始化 Craft 环境
        run: |
          python3 -c "$(curl https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py)" --prefix ~/CraftRoot
          echo "source ~/CraftRoot/craft/craftenv.sh" >> $GITHUB_ENV

      - name: 构建应用
        run: |
          # 将 'your_app_name' 替换为你的实际项目名
          craft your_app_name

      - name: 打包 APK
        run: |
          craft --package your_app_name

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ~/CraftRoot/tmp/*.apk
