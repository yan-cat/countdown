<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 桌面图标背景渐变 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CB8F0" />
      <stop offset="100%" stop-color="#1E6DA8" />
    </linearGradient>
    
    <!-- 图标阴影，增加立体感 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. 基础底板：圆角方形，带阴影 -->
  <rect width="256" height="256" rx="56" fill="url(#bgGradient)" filter="url(#shadow)" />

  <!-- 2. 中心图标：垂直居中的垃圾桶 + 向下箭头 -->
  <g id="uninstall-icon">
    <!-- 垃圾桶把手 -->
    <rect x="110" y="65" width="36" height="15" rx="7.5" fill="#FFFFFF" />
    
    <!-- 垃圾桶盖子 -->
    <rect x="68" y="80" width="120" height="18" rx="6" fill="#FFFFFF" />
    
    <!-- 垃圾桶主体（上宽下窄，带圆角） -->
    <path d="M 83 98 L 173 98 L 163 182 Q 162 190 155 190 L 101 190 Q 94 190 93 182 Z" fill="#FFFFFF" />
    
    <!-- 向下箭头（表示卸载/删除） -->
    <!-- 箭杆 -->
    <rect x="122" y="122" width="12" height="35" rx="6" fill="#F5A623" />
    <!-- 箭头头部 -->
    <path d="M 112 147 L 128 165 L 144 147" fill="none" stroke="#F5A623" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>